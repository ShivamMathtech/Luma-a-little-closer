[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-api"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.0.55",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "pwdlib[argon2]==0.3.1",
  "python-multipart==0.0.32",
  "email-validator==2.3.0",
  "pillow==13.0.0",
  "boto3==1.43.120",
  "redis==8.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "httpx==0.28.1",
  "ruff==0.17.3",
  "httpx2==2.16.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F403", "F405"]
