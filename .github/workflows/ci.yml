name: Luma checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: luma
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: luma_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U luma -d luma_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://luma:ci_only@localhost:5432/luma_test
      DATABASE_URL: postgresql+psycopg://luma:ci_only@localhost:5432/luma_test
      REDIS_URL: ''
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.lock -e '.[dev]'
      - run: alembic upgrade head
      - run: alembic check
      - run: ruff check app tests
      - run: python -m pytest --cov=app --cov-report=term-missing
      - run: alembic downgrade base && alembic upgrade head
